name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_prod:
        description: Promote the same image tag to prod (production environment approval)
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# Push to main → deploy dev, then wait for GitHub Environment "production"
# required-reviewer approval before promoting the same image tag to prod.
# Rebuild Platform dispatches with promote_prod=false so seeding only waits on dev.
# Scaffold / org setup creates that environment with reviewers automatically.

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and push Dev image
        id: build
        uses: QRify-platform/github-actions/docker-build-push@main
        with:
          image-name: qrify-web-dev
          aws-role-to-assume: ${{ vars.AWS_ECR_ROLE_TO_ASSUME }}
          aws-region: us-east-2
          ecr-registry: ${{ vars.AWS_ECR_REGISTRY }}
          build-args: "--build-arg NEXT_PUBLIC_API_BASE_URL=/backend"

      - name: Point cluster-state dev at new tag
        uses: QRify-platform/github-actions/update-app-tag@main
        with:
          image-tag: ${{ steps.build.outputs.tag }}
          github-token: ${{ secrets.CLUSTER_STATE_PAT }}
          cluster-repo: QRify-platform/cluster-state
          values-file-path: apps/qrify-web/values.dev.yaml

  promote-prod:
    needs: deploy-dev
    # Push always promotes (with env gate). Dispatch honors promote_prod input.
    if: ${{ github.event_name == 'push' || inputs.promote_prod == true || inputs.promote_prod == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Promote image to prod ECR repo
        uses: QRify-platform/github-actions/ecr-retag@main
        with:
          source-image-name: qrify-web-dev
          target-image-name: qrify-web-prod
          image-tag: ${{ needs.deploy-dev.outputs.tag }}
          aws-role-to-assume: ${{ vars.AWS_ECR_ROLE_TO_ASSUME }}
          aws-region: us-east-2
          ecr-registry: ${{ vars.AWS_ECR_REGISTRY }}

      - name: Point cluster-state prod at promoted tag
        uses: QRify-platform/github-actions/update-app-tag@main
        with:
          image-tag: ${{ needs.deploy-dev.outputs.tag }}
          github-token: ${{ secrets.CLUSTER_STATE_PAT }}
          cluster-repo: QRify-platform/cluster-state
          values-file-path: apps/qrify-web/values.prod.yaml
